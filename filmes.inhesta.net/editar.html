<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usu√°rio - AWS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style-editar.css">
</head>
<body>
    <header>
    <div class="header-left">
        <h1>Editar Perfil</h1>
    </div>
    <div class="header-center">
        <a href="index.html" class="link-home">Home</a>
    </div>
    <div class="header-right user-info">
        <div class="user-name" id="usuarioLogado">Ol·, Usu·rio</div>
        <a href="acesso.html" class="btn-editar">¡rea Restrita</a>
        <button id="btnSair" class="btn-sair">Sair</button>
    </div>
</header>

    <main>
        <div id="loading" class="loading">Carregando dados...</div>

        <form id="formEditar" style="display: none;">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="form-group">
                <label for="sobrenome">Sobrenome:</label>
                <input type="text" id="sobrenome" name="sobrenome" required>
            </div>

            <div class="form-group">
                <label for="login">Login:</label>
                <input type="text" id="login" name="login" required readonly>
                <small class="info">Login n√£o pode ser alterado</small>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9" onkeyup="formatarCEP(this); buscarCEP()" onblur="buscarCEP()">
            </div>

            <div class="form-group">
                <label for="logradouro">Logradouro:</label>
                <input type="text" id="logradouro" name="logradouro">
            </div>

            <div class="form-group">
                <label for="bairro">Bairro:</label>
                <input type="text" id="bairro" name="bairro">
            </div>

            <div class="form-group">
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade">
            </div>

            <div class="form-group">
                <label for="estado">Estado:</label>
                <input type="text" id="estado" name="estado">
            </div>

            <div class="form-group">
                <label for="senha_atual">Senha Atual (para confirmar):</label>
                <input type="password" id="senha_atual" name="senha_atual" required>
            </div>

            <div class="form-group">
                <label for="nova_senha">Nova Senha (opcional):</label>
                <input type="password" id="nova_senha" name="nova_senha" placeholder="Deixe em branco para manter">
            </div>

            <div class="form-group">
                <label for="confirmar_senha">Confirmar Nova Senha:</label>
                <input type="password" id="confirmar_senha" name="confirmar_senha">
            </div>

            <button type="submit" class="btn-submit">Salvar Altera√ß√µes</button>
            <button type="button" class="btn-cancel" onclick="window.location.href='index.html'">Cancelar</button>
        </form>

        <div id="mensagem" class="mensagem"></div>
    </main>

    <footer>
        <p>&copy; 2024 AWS - Todos os direitos reservados</p>
    </footer>

    <script src="banco.js"></script>
    <script src="script-editar.js"></script>
</body>
</html>
